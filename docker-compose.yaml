services:
  db:
    image: postgres:16
    container_name: remind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: remind
      POSTGRES_PASSWORD: remind_local_pw
      POSTGRES_DB: remind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
